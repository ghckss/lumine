server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  server_tokens off;

  location /_next/static/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri $uri.html $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}

