apiVersion: apps/v1
kind: Deployment
metadata:
  name: lumine-server
  namespace: ${K8S_NAMESPACE_SERVER}
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lumine-server
  template:
    metadata:
      labels:
        app: lumine-server
    spec:
      containers:
        - name: lumine-server
          image: ${SERVER_IMAGE}
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: postgres
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: lumine-server-secrets
                  key: db-url
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: lumine-server-secrets
                  key: db-username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lumine-server-secrets
                  key: db-password
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: lumine-server
  namespace: ${K8S_NAMESPACE_SERVER}
spec:
  selector:
    app: lumine-server
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lumine-server
  namespace: ${K8S_NAMESPACE_SERVER}
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
spec:
  rules:
    - host: ${API_HOST}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lumine-server
                port:
                  number: 80
