spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lumine}
    username: ${DB_USERNAME:lumine}
    password: ${DB_PASSWORD:lumine}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:5}
      minimum-idle: ${DB_MIN_IDLE:1}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration/postgresql
