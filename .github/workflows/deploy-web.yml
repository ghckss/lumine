name: Deploy web to Amazon EKS

on:
  push:
    branches:
      - master
    paths:
      - "client/apps/web/**"
      - "client/packages/domain/**"
      - "client/package.json"
      - "client/pnpm-lock.yaml"
      - "client/pnpm-workspace.yaml"
      - "client/turbo.json"
      - "infra/k8s/base/namespace.yaml"
      - "infra/k8s/base/web.yaml"
      - "infra/k8s/overlays/production/ingress.yaml"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-web
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  ECR_WEB_REPOSITORY: ${{ vars.ECR_WEB_REPOSITORY }}
  EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run typecheck lint --filter=@lumine/web
      - run: pnpm turbo run build --filter=@lumine/web
        env:
          NEXT_PUBLIC_LUMINE_API_BASE_URL: ${{ vars.LUMINE_PUBLIC_BASE_URL }}

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: lumine-web-${{ github.run_id }}
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - name: Build and push immutable web image
        uses: docker/build-push-action@v6
        with:
          context: client
          file: client/apps/web/Dockerfile
          push: true
          platforms: linux/amd64
          build-args: NEXT_PUBLIC_LUMINE_API_BASE_URL=${{ vars.LUMINE_PUBLIC_BASE_URL }}
          tags: ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_WEB_REPOSITORY }}:${{ github.sha }}-${{ github.run_attempt }}
          cache-from: type=gha,scope=lumine-web
          cache-to: type=gha,mode=max,scope=lumine-web
      - name: Configure kubectl
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION"
      - name: Deploy web and ALB ingress
        env:
          WEB_IMAGE: ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_WEB_REPOSITORY }}:${{ github.sha }}-${{ github.run_attempt }}
          ACM_CERTIFICATE_ARN: ${{ vars.ACM_CERTIFICATE_ARN }}
        run: |
          test -n "$ACM_CERTIFICATE_ARN"
          kubectl apply -f infra/k8s/base/namespace.yaml
          kubectl -n lumine apply -f infra/k8s/base/web.yaml
          kubectl -n lumine set image deployment/lumine-web web="$WEB_IMAGE"

          ingress_file="$RUNNER_TEMP/lumine-ingress.yaml"
          sed "s|REPLACE_ACM_CERTIFICATE_ARN|$ACM_CERTIFICATE_ARN|g" \
            infra/k8s/overlays/production/ingress.yaml > "$ingress_file"
          kubectl apply -f "$ingress_file"
          kubectl -n lumine rollout status deployment/lumine-web --timeout=10m
          kubectl -n lumine get ingress lumine
